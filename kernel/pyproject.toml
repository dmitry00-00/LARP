[project]
name = "hmb-kernel"
version = "0.1.0"
description = "Домен-независимое ядро приёма и нормализации, перенесённое из recruit 15.09.2026"
requires-python = ">=3.11"
dependencies = [
  "structlog>=24",
  "httpx>=0.27",
  "pydantic-settings>=2",
  "telethon>=1.36",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kernel*"]
